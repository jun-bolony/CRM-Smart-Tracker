name: 🐛 Bug Report
description: File a bug report to help us improve CRM-Smart-Tracker.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - jun-bolony
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🙏
        Please check that a similar issue doesn't already exist before submitting.

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we reach you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: A clear and concise description of what you expected.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: A clear and concise description of what actually happened.
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Version
      description: Which version of the app are you using?
      options:
        - v.0.9.95 or higher
        - v.0.9.90
        - v.0.9.80
        - v.0.9.0
        - Older / Other
    validations:
      required: true

  - type: dropdown
    id: browsers
    attributes:
      label: Browser / Environment
      description: Where did you encounter this issue?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile (iOS)
        - Mobile (Android)
        - Other
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output (console errors, network responses). This will be automatically formatted into code.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen recordings
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Drag and drop images here or paste a link.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/jun-bolony/CRM-Smart-Tracker/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true